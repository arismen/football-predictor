# Put this at .github/workflows/update.yml in your GitHub repo.
# Runs every Monday and Thursday, refreshes the ratings, and commits the updated page.
name: Update ratings
on:
  schedule:
    - cron: "0 7 * * 1,4"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install pandas numpy scipy
      - run: python update_ratings.py index.html
      - name: Commit if changed
        run: |
          git config user.name "ratings-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Update ratings" && git push)
